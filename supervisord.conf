[supervisord]
nodaemon=true

[program:java-setup]
command=/bin/bash -c "echo %(ENV_URL)s > /root/.java/deployment/security/exception.sites"
autorestart=false
startsecs=0

[program:X11]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_RES)s
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc
autorestart=true

[program:novnc]
command=/root/novnc/utils/launch.sh --vnc localhost:5900 --listen 8080
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
autorestart=true

[program:chromium]
command=/usr/bin/chromium-browser --no-sandbox -test-type --window-position=0,0 --start-maximized --disable-popup-blocking --safebrowsing-disable-download-protection --allow-file-access-from-files --unsafely-treat-insecure-origin-as-secure=%(ENV_URL)s %(ENV_URL)s
autorestart=true


